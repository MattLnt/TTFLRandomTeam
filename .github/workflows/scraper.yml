name: TTFL Scraper

on:
  schedule:
    - cron: '15 12-17 * * *'
    - cron: '15,45 17-22 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      
      - name: Install dependencies
        working-directory: ./scraper
        run: npm install
      
      - name: Restore cookies from secret
        working-directory: ./scraper
        run: echo '${{ secrets.COOKIES_JSON }}' > cookies.json
      
      - name: Run scraper with virtual display
        working-directory: ./scraper
        run: xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24' node scraper-final.js
        env:
          TWOCAPTCHA_API_KEY: ${{ secrets.TWOCAPTCHA_API_KEY }}
      
      - name: Commit and push if changed
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add scraper/all_members.json scraper/cookies.json
          git diff --staged --quiet || git commit -m "Auto-update picks"
          git push